plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
    id 'net.neoforged.gradle.mixin' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

def gameTestNamespaces = providers.gradleProperty('hotbath.gameTestNamespaces')
        .orElse(mod_id)
        .get()
def skipOptionalRuntimeMods = providers.gradleProperty('hotbath.skipOptionalRuntimeMods')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        workingDirectory project.file('run')

        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', gameTestNamespaces
        systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', gameTestNamespaces
        systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        programArgument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', gameTestNamespaces
        systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
    }

    data {
        // example of overriding the workingDirectory set in configureEach above
        workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixin configuration
mixin {
    config 'hotbath.mixins.json'
    config 'hotbath.alexsmobs.mixins.json'
    config 'hotbath.alexscaves.mixins.json'
    config 'hotbath.sodium.mixins.json'
    config 'hotbath.twilightforest.mixins.json'
    config 'hotbath.lso.mixins.json'
    config 'hotbath.create.mixins.json'
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    flatDir {
        dir 'libs'
    }
}

dependencies {
    // Optional EMF animation API; neither dependency is bundled or required at runtime.
    compileOnly "maven.modrinth:entity-model-features:bRlX1x4e"
    compileOnly "maven.modrinth:entitytexturefeatures:CfQJbv1u"

    def optionalRuntimeOnly = { dependencyNotation ->
        if (!skipOptionalRuntimeMods) {
            add("runtimeOnly", dependencyNotation)
        }
    }

    implementation "net.neoforged:neoforge:${neo_version}"

    // Patchouli - Guide book mod (optional dependency)
    // Project ID: 306770, File ID 6842247 corresponds to Patchouli for NeoForge 1.21.1
    compileOnly "curse.maven:patchouli-306770:6842247"
    optionalRuntimeOnly "curse.maven:patchouli-306770:6842247"

    // ColdSweat - Temperature and season mod (optional dependency)
    // compileOnly for API access, runtimeOnly to have it in dev environment
    compileOnly "curse.maven:cold-sweat-506194:7492465"
    // runtimeOnly "curse.maven:cold-sweat-506194:7492465"

    // GlitchCore - Library mod required by ToughAsNails
    // Project ID: 955399, File ID 5660740 corresponds to GlitchCore-neoforge-1.21.1-2.1.0.0.jar
    // runtimeOnly because it's a library dependency needed at runtime
    optionalRuntimeOnly "curse.maven:glitchcore-955399:5660740"

    // ToughAsNails - Temperature and thirst mod (optional dependency)
    // Project ID: 246391, File ID 5766204 corresponds to ToughAsNails-neoforge-1.21.1-10.1.0.11.jar
    // compileOnly for API access, runtimeOnly to have it in dev environment
    compileOnly "curse.maven:tough-as-nails-246391:5766204"
    optionalRuntimeOnly "curse.maven:tough-as-nails-246391:5766204"

    // Legendary Survival Overhaul - Temperature and survival overhaul mod (optional dependency)
    // Project ID: 840254, File ID 7254309 corresponds to legendarysurvivaloverhaul-1.21.1-2.3.24.5.jar
    // compileOnly for API access, runtimeOnly to have it in dev environment
    compileOnly "curse.maven:legendary-survival-overhaul-840254:7254309"
    optionalRuntimeOnly "curse.maven:legendary-survival-overhaul-840254:7254309"

    // Alex's Mobs - Animal/creature mod (optional dependency)
    // Using local project build output since 1.21 version is not yet published
    compileOnly files('../AlexsMobs/build/libs/alexsmobs-1.22.9.jar')
    // Citadel - Library mod required by Alex's Mobs and Alex's Caves
    // Using local project build output
    compileOnly files('../Citadel/build/libs/citadel-1.21.1-2.7.0.jar')
    // Uncomment to test in dev environment:
    optionalRuntimeOnly files('../AlexsMobs/build/libs/alexsmobs-1.22.9.jar')
    optionalRuntimeOnly files('../Citadel/build/libs/citadel-1.21.1-2.7.0.jar')

    // Alex's Caves - Cave biome and creature mod (optional dependency)
    // Using local project build output since 1.21 version is not yet published
    compileOnly files('../AlexsCaves/build/libs/alexscaves-2.0.2.jar')
    optionalRuntimeOnly files('../AlexsCaves/build/libs/alexscaves-2.0.2.jar')

    // Twilight Forest - Fantasy dimension mod (optional dependency)
    // Project ID: 227639, File ID 7398100 corresponds to twilightforest for 1.21.1
    compileOnly "curse.maven:the-twilight-forest-227639:7398100"
    optionalRuntimeOnly "curse.maven:the-twilight-forest-227639:7398100"

    // Create - Mechanical and automation mod (optional dependency)
    // Project ID: 328085, File ID 7408951 corresponds to Create 6.0.4 for NeoForge 1.21.1
    compileOnly "curse.maven:create-328085:7408951"
    optionalRuntimeOnly "curse.maven:create-328085:7408951"

    // Farmer's Delight - Cooking and farming mod (optional dependency)
    // Project ID: 398521, File ID 8083481 corresponds to Farmer's Delight 1.3.2 for NeoForge 1.21.1
    compileOnly "curse.maven:farmers-delight-398521:8083481"
    optionalRuntimeOnly "curse.maven:farmers-delight-398521:8083481"

    // Serene Seasons - Seasons mod (optional dependency)
    // Project ID: 291874, File ID 6182596 corresponds to sereneseasons for NeoForge 1.21.1
    compileOnly "curse.maven:serene-seasons-291874:6182596"
    optionalRuntimeOnly "curse.maven:serene-seasons-291874:6182596"

    // Epic Fight - Combat animation mod (optional dependency)
    // Project ID: 405076, File ID 8175609 corresponds to Epic Fight 21.17.3.1 for NeoForge 1.21.1
    compileOnly "curse.maven:epic-fight-mod-405076:8175609"
    optionalRuntimeOnly "curse.maven:epic-fight-mod-405076:8175609"

    // Sodium - Performance optimization mod (optional dependency for testing)
    // Project ID: 394468, File ID 6382651
    compileOnly "curse.maven:sodium-394468:6382651"
    optionalRuntimeOnly "curse.maven:sodium-394468:6382651"

    // ---- Unit tests ----
    // Pure-Java unit tests for compat logic that does not touch Minecraft types
    // (see ColdSweatImmersionGate). No Minecraft bootstrapping required.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta', 'data/hotbath/patchouli_books/hotbath_guide/book.json']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1', // We are version 1 of ourselves
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Run unit tests with the JUnit 5 platform.
// These tests are scoped to pure-Java compat helpers (no Minecraft runtime).
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

eclipse {
    // Run everytime eclipse builds the code
    //autoBuildTasks genEclipseRuns
    // Run when importing the project
    synchronizationTasks 'genEclipseRuns'
}

// Merge the resources and classes into the same directory. 
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}


// Focused regression tests are a development mod, never part of the production JAR.
sourceSets {
    bucketTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        def outputDirectory = layout.buildDirectory.dir('sourcesSets/bucketTest').get().asFile
        output.resourcesDir = outputDirectory
        java.destinationDirectory = outputDirectory
    }
}
configurations.bucketTestImplementation.extendsFrom(configurations.implementation)
configurations.bucketTestCompileOnly.extendsFrom(configurations.compileOnly)
configurations.bucketTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
tasks.named('check') { dependsOn tasks.named('bucketTestClasses') }
runs.gameTestServer {
    modSources { add('hotbath_bucket_tests', sourceSets.bucketTest) }
}
